[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hashedtokens"
version = "0.1.0"
description = "Async Python wrapper for the HashedTokens EDMS collections API"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "HashedTokens" }]
license = { text = "MIT" }
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
